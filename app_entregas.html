<style>
:root{
  color-scheme: light dark;
  --plane:#f9f9f7; --surface:#fcfcfb; --ink:#0b0b0b; --ink2:#52514e; --muted:#898781;
  --line:#e1e0d9; --ring:rgba(11,11,11,.10);
  --good:#0ca30c; --warn:#fab219; --serious:#ec835a; --crit:#d03b3b;
  --obs-bg:#fff7dc; --obs-line:#e6cf85;
}
@media (prefers-color-scheme: dark){
  :root{
    --plane:#0d0d0d; --surface:#1a1a19; --ink:#fff; --ink2:#c3c2b7; --muted:#898781;
    --line:#2c2c2a; --ring:rgba(255,255,255,.10);
    --obs-bg:#2a2410; --obs-line:#5c5023;
  }
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;background:var(--plane);color:var(--ink);
  font:16px/1.45 system-ui,-apple-system,"Segoe UI",sans-serif;
  padding-bottom:env(safe-area-inset-bottom)}
header{position:sticky;top:0;z-index:10;background:var(--surface);
  border-bottom:1px solid var(--line);padding:12px 14px 10px;
  padding-top:calc(12px + env(safe-area-inset-top))}
.top{display:flex;align-items:baseline;justify-content:space-between;gap:8px}
h1{font-size:17px;margin:0;letter-spacing:-.01em}
.stamp{font-size:12px;color:var(--muted)}
#busca{width:100%;margin-top:10px;padding:12px 14px;font-size:16px;
  border:1px solid var(--line);border-radius:12px;background:var(--plane);color:var(--ink)}
#busca:focus{outline:2px solid var(--ink2);outline-offset:-1px}
.chips{display:flex;gap:7px;margin-top:10px;overflow-x:auto;scrollbar-width:none;padding-bottom:2px}
.chips::-webkit-scrollbar{display:none}
.chip{flex:0 0 auto;padding:7px 13px;border-radius:999px;border:1px solid var(--line);
  background:var(--plane);color:var(--ink2);font-size:13.5px;font-weight:600;cursor:pointer}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--surface);border-color:var(--ink)}
.chip .n{opacity:.65;font-weight:500}
main{padding:12px 12px 28px;max-width:720px;margin:0 auto}
.card{background:var(--surface);border:1px solid var(--ring);border-radius:14px;
  padding:13px 14px;margin-bottom:10px}
.card.crit{border-left:4px solid var(--crit)}
.card.warn{border-left:4px solid var(--warn)}
.card.serious{border-left:4px solid var(--serious)}
.card.good{border-left:4px solid var(--good)}
.linha1{display:flex;align-items:flex-start;justify-content:space-between;gap:10px}
.nome{font-weight:650;font-size:16.5px;letter-spacing:-.01em;line-height:1.25}
.ped{font-size:13px;color:var(--muted);font-variant-numeric:tabular-nums;white-space:nowrap}
.badge{display:inline-flex;align-items:center;gap:5px;margin-top:8px;
  padding:4px 10px 4px 8px;border-radius:999px;font-size:12.5px;font-weight:700;
  border:1px solid transparent}
.b-crit{background:color-mix(in srgb,var(--crit) 15%,transparent);color:var(--crit);border-color:color-mix(in srgb,var(--crit) 40%,transparent)}
.b-warn{background:color-mix(in srgb,var(--warn) 20%,transparent);color:var(--ink);border-color:color-mix(in srgb,var(--warn) 55%,transparent)}
.b-serious{background:color-mix(in srgb,var(--serious) 18%,transparent);color:var(--ink);border-color:color-mix(in srgb,var(--serious) 50%,transparent)}
.b-good{background:color-mix(in srgb,var(--good) 14%,transparent);color:var(--good);border-color:color-mix(in srgb,var(--good) 38%,transparent)}
.b-neutro{background:var(--plane);color:var(--ink2);border-color:var(--line)}
.grade{margin-top:10px;display:grid;grid-template-columns:auto 1fr;gap:5px 12px;font-size:14px}
.k{color:var(--muted);font-size:13px;white-space:nowrap}
.v{color:var(--ink2)}
.v b{color:var(--ink);font-weight:650}
.obs{margin-top:10px;background:var(--obs-bg);border:1px solid var(--obs-line);
  border-radius:9px;padding:9px 11px;font-size:14px;line-height:1.4}
.obs .rot{display:block;font-size:11px;text-transform:uppercase;letter-spacing:.06em;
  color:var(--muted);margin-bottom:3px;font-weight:700}
.acoes{display:flex;gap:8px;margin-top:11px;flex-wrap:wrap}
.bt{flex:1 1 auto;text-align:center;padding:9px 12px;border-radius:10px;font-size:14px;
  font-weight:600;border:1px solid var(--line);background:var(--plane);color:var(--ink);
  text-decoration:none;cursor:pointer;min-width:120px}
.bt:active{background:var(--line)}
.vazio{text-align:center;color:var(--muted);padding:44px 20px;font-size:15px}
#login{max-width:380px;margin:16vh auto;padding:0 22px;text-align:center}
#login h2{font-size:19px;margin:0 0 6px}
#login p{color:var(--ink2);font-size:14px;margin:0 0 18px}
#senha{width:100%;padding:13px 14px;font-size:16px;border:1px solid var(--line);
  border-radius:12px;background:var(--surface);color:var(--ink);text-align:center}
#entrar{width:100%;margin-top:10px;padding:13px;font-size:15px;font-weight:650;
  border:none;border-radius:12px;background:var(--ink);color:var(--surface);cursor:pointer}
#erro{color:var(--crit);font-size:13.5px;margin-top:10px;min-height:19px;font-weight:600}
.hint{font-size:12px;color:var(--muted);margin-top:16px}
.bt-forte{background:var(--ink);color:var(--surface);border-color:var(--ink);flex:2 1 100%}
#modal{position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:40;display:flex;align-items:flex-end}
#modal[hidden]{display:none}
.folha{background:var(--surface);width:100%;max-width:720px;margin:0 auto;
  border-radius:18px 18px 0 0;padding:16px 15px calc(16px + env(safe-area-inset-bottom));
  max-height:88vh;overflow:auto}
.mtop{display:flex;align-items:flex-start;justify-content:space-between;gap:10px;margin-bottom:10px}
.mtop strong{display:block;font-size:16px}
.mdica{display:block;font-size:12.5px;color:var(--muted);margin-top:2px}
#mfechar{background:none;border:none;font-size:20px;color:var(--ink2);cursor:pointer;padding:0 4px;line-height:1}
#mtexto{width:100%;padding:12px;font-size:15px;line-height:1.5;border:1px solid var(--line);
  border-radius:12px;background:var(--plane);color:var(--ink);resize:vertical;
  font-family:inherit;-webkit-text-size-adjust:100%}
.macoes{display:flex;gap:8px;margin-top:11px;flex-wrap:wrap}
.macoes .bt{flex:1 1 100%}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:26px;background:var(--ink);
  color:var(--surface);padding:11px 18px;border-radius:999px;font-size:14px;font-weight:600;
  opacity:0;pointer-events:none;transition:opacity .18s;z-index:50}
.toast.on{opacity:1}
</style>
</head>
<body>

<div id="login">
  <h2>Entregas · by Olivia</h2>
  <p>Digite a senha para abrir o painel.</p>
  <input id="senha" type="password" inputmode="text" autocomplete="current-password" placeholder="senha">
  <button id="entrar">Abrir</button>
  <div id="erro"></div>
  <div class="hint">Os dados ficam criptografados neste arquivo. Sem a senha, ninguém lê.</div>
</div>

<div id="app" hidden>
  <header>
    <div class="top">
      <h1>Entregas</h1>
      <span class="stamp" id="stamp"></span>
    </div>
    <input id="busca" type="search" inputmode="search" placeholder="Buscar cliente ou nº do pedido">
    <div class="chips" id="chips"></div>
  </header>
  <main id="lista"></main>
</div>

<div id="modal" hidden>
  <div class="folha" role="dialog" aria-label="Resposta pronta">
    <div class="mtop">
      <div><strong id="mnome"></strong><span class="mdica">edite antes de enviar, se quiser</span></div>
      <button id="mfechar" aria-label="Fechar">✕</button>
    </div>
    <textarea id="mtexto" rows="11"></textarea>
    <div class="macoes">
      <button class="bt bt-forte" id="mcopiar">Copiar mensagem</button>
      <button class="bt" id="mwhats">Abrir no WhatsApp</button>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>

const b64 = s => Uint8Array.from(atob(s), c => c.charCodeAt(0));

async function abrir(senha){
  const enc = new TextEncoder();
  const base = await crypto.subtle.importKey('raw', enc.encode(senha), 'PBKDF2', false, ['deriveKey']);
  const chave = await crypto.subtle.deriveKey(
    {name:'PBKDF2', salt:b64(PAYLOAD.s), iterations:PAYLOAD.it, hash:'SHA-256'},
    base, {name:'AES-GCM', length:256}, false, ['decrypt']);
  const claro = await crypto.subtle.decrypt({name:'AES-GCM', iv:b64(PAYLOAD.n)}, chave, b64(PAYLOAD.c));
  return JSON.parse(new TextDecoder().decode(claro));
}

let DADOS = null, filtro = 'acao', termo = '';

const CLASSES = {
  'AÇÃO SUA':['crit','b-crit','!'],
  'ATRASADO':['crit','b-crit','●'],
  'VENCE HOJE':['warn','b-warn','◐'],
  'ATENÇÃO':['serious','b-serious','◔'],
  'No prazo':['good','b-good','✓'],
  'ENTREGUE':['good','b-good','✓'],
  'TRAVADO':['crit','b-crit','▲']
};

function ehAcaoSua(e){ return (e.real||'').toUpperCase().startsWith('AÇÃO SUA') || e.sit === 'AÇÃO SUA'; }
function ehEntregue(e){ return !ehAcaoSua(e) && (e.real||'').toLowerCase().startsWith('entregue'); }

function grupo(e){
  if (ehAcaoSua(e)) return 'acao_sua';
  if (e.aba === 'travado') return ehEntregue(e) ? 'ok' : 'travado';
  if (e.sit === 'ATRASADO') return 'atrasado';
  if (e.sit === 'VENCE HOJE') return 'hoje';
  return 'ok';
}

function conta(g){ return DADOS.envios.filter(e => grupo(e) === g).length; }

function filtrar(){
  let l = DADOS.envios;
  if (termo){
    const t = termo.toLowerCase();
    l = l.filter(e => (e.nome||'').toLowerCase().includes(t)
                   || String(e.ped).includes(t)
                   || (e.rast||'').toLowerCase().includes(t));
    return l;
  }
  if (filtro === 'acao') l = l.filter(e => ['acao_sua','atrasado','hoje','travado'].includes(grupo(e)));
  else if (filtro !== 'tudo') l = l.filter(e => grupo(e) === filtro);
  const ordem = {acao_sua:0, atrasado:1, hoje:2, travado:3, ok:4};
  return l.slice().sort((a,b) => ordem[grupo(a)] - ordem[grupo(b)]);
}

function esc(s){ return String(s==null?'':s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])); }

function card(e){
  const rot = ehAcaoSua(e) ? 'AÇÃO SUA'
            : (e.aba === 'travado' ? (ehEntregue(e) ? 'ENTREGUE' : 'TRAVADO') : e.sit);
  const [cls, bcls, ico] = CLASSES[rot] || ['', 'b-neutro', '•'];
  let extra = '';
  if (e.sit === 'ATRASADO' && e.atraso) extra = ` · ${e.atraso} dia(s)`;
  const linhas = [];
  if (ehAcaoSua(e)) linhas.push(['Atenção',
    '<b>A transportadora está esperando você. O pedido só volta a andar depois que você resolver a pendência no Enviali.</b>']);
  if (e.real) linhas.push(['Rastreio', `<b>${esc(e.real)}</b>`]);
  if (e.aba !== 'travado' && e.prev) linhas.push(['Previsão', esc(e.prev)]);
  if (e.aba === 'travado' && e.parado) linhas.push(['Parado há', `${esc(e.parado)} dias`]);
  linhas.push(['Transportadora', esc(e.transp)]);
  if (e.enviali) linhas.push(['No Enviali', esc(e.enviali)]);
  linhas.push(['Postado', esc(e.post)]);
  if (e.aba === 'travado' && e.acao) linhas.push(['O que fazer', esc(e.acao)]);

  return `<article class="card ${cls}">
    <div class="linha1">
      <div class="nome">${esc(e.nome)}</div>
      <div class="ped">#${esc(e.ped)}</div>
    </div>
    <span class="badge ${bcls}">${ico} ${esc(rot)}${extra}</span>
    <div class="grade">${linhas.map(([k,v]) => `<span class="k">${k}</span><span class="v">${v}</span>`).join('')}</div>
    ${e.obs ? `<div class="obs"><span class="rot">Sua observação</span>${esc(e.obs)}</div>` : ''}
    <div class="acoes">
      <button class="bt bt-forte" data-msg="${esc(e.ped)}">Resposta pronta</button>
      <button class="bt" data-copiar="${esc(e.rast)}">Copiar rastreio</button>
      <a class="bt" href="${esc(e.link)}" target="_blank" rel="noopener">Abrir rastreio</a>
    </div>
  </article>`;
}

function tipoMsg(e){
  const real = (e.real||'').toLowerCase();
  if (ehAcaoSua(e)) return 'acao_sua';
  if (real.startsWith('entregue')) return 'entregue';
  if (e.aba === 'travado') return 'travado';
  if (real.includes('saiu para entrega') || real.includes('em rota')) return 'saiu_entrega';
  if (e.sit === 'ATRASADO') return 'atrasado';
  if (e.sit === 'VENCE HOJE') return 'hoje';
  return 'transito';
}

function montarMsg(e){
  const t = DADOS.msgs[tipoMsg(e)] || DADOS.msgs.transito;
  const vals = {
    nome: String(e.nome||'').trim().split(/\s+/)[0] || '',
    nome_completo: e.nome || '',
    ped: e.ped, prev: e.prev || 'a confirmar',
    transp: e.transp || '', rast: e.rast || '',
    real: e.real || 'sem novidade no rastreio'
  };
  return t.replace(/\{(\w+)\}/g, (m,k) => (k in vals ? vals[k] : m));
}

function pinta(){
  const l = filtrar();
  const el = document.getElementById('lista');
  if (!l.length){
    el.innerHTML = `<div class="vazio">${termo ? 'Nada encontrado para "' + esc(termo) + '".' : 'Nada aqui. Tudo tranquilo.'}</div>`;
    return;
  }
  el.innerHTML = l.map(card).join('');
}

function chips(){
  const defs = [
    ['acao', 'Precisa de ação', conta('acao_sua') + conta('atrasado') + conta('hoje') + conta('travado')],
    ['acao_sua', 'Você tem que agir', conta('acao_sua')],
    ['atrasado', 'Atrasados', conta('atrasado')],
    ['hoje', 'Vencem hoje', conta('hoje')],
    ['travado', 'Travados', conta('travado')],
    ['tudo', 'Tudo', DADOS.envios.length]
  ];
  document.getElementById('chips').innerHTML = defs.map(([k,r,n]) =>
    `<button class="chip" data-f="${k}" aria-pressed="${k===filtro}">${r} <span class="n">${n}</span></button>`).join('');
}

function toast(t){
  const el = document.getElementById('toast');
  el.textContent = t; el.classList.add('on');
  clearTimeout(el._t); el._t = setTimeout(() => el.classList.remove('on'), 1500);
}

function fechaModal(){ document.getElementById('modal').hidden = true; }

document.addEventListener('click', ev => {
  const m = ev.target.closest('[data-msg]');
  if (m){
    const e = DADOS.envios.find(x => String(x.ped) === m.getAttribute('data-msg'));
    if (e){
      document.getElementById('mtexto').value = montarMsg(e);
      document.getElementById('mnome').textContent = e.nome;
      document.getElementById('modal').hidden = false;
    }
    return;
  }
  if (ev.target.id === 'mfechar' || ev.target.id === 'modal'){ fechaModal(); return; }
  if (ev.target.id === 'mcopiar'){
    const v = document.getElementById('mtexto').value;
    navigator.clipboard.writeText(v).then(() => { toast('Mensagem copiada'); fechaModal(); },
      () => toast('Não consegui copiar'));
    return;
  }
  if (ev.target.id === 'mwhats'){
    const v = encodeURIComponent(document.getElementById('mtexto').value);
    window.open('https://wa.me/?text=' + v, '_blank', 'noopener');
    return;
  }
  const c = ev.target.closest('[data-copiar]');
  if (c){
    const v = c.getAttribute('data-copiar');
    navigator.clipboard.writeText(v).then(() => toast('Rastreio copiado'),
      () => toast('Não consegui copiar'));
    return;
  }
  const ch = ev.target.closest('.chip');
  if (ch){
    filtro = ch.dataset.f; termo = '';
    document.getElementById('busca').value = '';
    chips(); pinta();
  }
});

document.getElementById('busca').addEventListener('input', ev => {
  termo = ev.target.value.trim();
  pinta();
});

async function entrar(){
  const s = document.getElementById('senha').value;
  const erro = document.getElementById('erro');
  erro.textContent = 'abrindo...';
  try {
    DADOS = await abrir(s);
    try { sessionStorage.setItem('k', s); } catch(_){}
    document.getElementById('login').hidden = true;
    document.getElementById('app').hidden = false;
    document.getElementById('stamp').textContent = 'atualizado ' + DADOS.quando;
    chips(); pinta();
  } catch(_){
    erro.textContent = 'Senha incorreta.';
    document.getElementById('senha').select();
  }
}

document.getElementById('entrar').addEventListener('click', entrar);
document.getElementById('senha').addEventListener('keydown', e => { if (e.key === 'Enter') entrar(); });

(function(){
  let s = null;
  try { s = sessionStorage.getItem('k'); } catch(_){}
  if (s){ document.getElementById('senha').value = s; entrar(); }
  else { document.getElementById('senha').focus(); }
})();
</script>
</body>
</html>
